[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anera-markets-examples-shared"
version = "0.1.0"
description = "Shared modules for anera.markets public API examples"
requires-python = ">=3.11"
dependencies = ["requests>=2.31.0,<3"]

[tool.setuptools.packages.find]
include = ["shared*"]
